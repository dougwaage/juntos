<title>Juntos · Frida</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #E8609A;
    --rose-light: #F4B0D0;
    --rose-dark: #982060;
    --cream: #FDF5F8;
    --sand: #F5E8EF;
    --deep: #2C1420;
    --muted: #B06080;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--deep);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: fixed;
    width: 100%;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(232,96,154,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .header {
    padding: env(safe-area-inset-top, 12px) 20px 12px;
    padding-top: max(env(safe-area-inset-top), 12px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(250,246,240,0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(232,96,154,0.15);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }

  .logo-area { display: flex; align-items: center; gap: 10px; }

  .logo-mark {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(232,96,154,0.3);
    flex-shrink: 0;
  }

  .logo-mark svg { width: 16px; height: 16px; fill: white; }

  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 300;
    letter-spacing: 0.04em; color: var(--deep);
  }

  .logo-text span { color: var(--rose); font-style: italic; }

  .header-right {
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted); background: var(--sand);
    padding: 4px 10px; border-radius: 20px;
  }

  .status-bar {
    padding: 8px 20px;
    background: rgba(122,158,126,0.08);
    border-bottom: 1px solid rgba(122,158,126,0.15);
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #7A9E7E;
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-text { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .chat-area::-webkit-scrollbar { display: none; }

  .date-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 4px 0;
  }

  .date-divider::before, .date-divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(232,96,154,0.2);
  }

  .date-divider span {
    font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); font-weight: 500;
  }

  .message {
    display: flex; flex-direction: column;
    max-width: 88%;
    animation: msgIn 0.35s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
    opacity: 0; transform: translateY(10px);
  }

  @keyframes msgIn { to { opacity: 1; transform: translateY(0); } }

  .message.agent { align-self: flex-start; }
  .message.user { align-self: flex-end; }

  .msg-label {
    font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; font-weight: 500;
    margin-bottom: 5px; padding: 0 3px;
  }

  .message.agent .msg-label { color: var(--rose); }
  .message.user .msg-label { color: var(--muted); text-align: right; }

  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.65; font-size: 14px; font-weight: 300;
  }

  .message.agent .bubble {
    background: white; color: var(--deep);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 12px rgba(44,20,32,0.07);
    border: 1px solid rgba(232,96,154,0.12);
  }

  .message.user .bubble {
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
    color: white; border-bottom-right-radius: 4px;
    box-shadow: 0 2px 12px rgba(232,96,154,0.25);
  }

  .typing-wrap {
    display: flex; align-self: flex-start;
    animation: msgIn 0.3s ease forwards; opacity: 0;
  }

  .typing-dots {
    background: white;
    border: 1px solid rgba(232,96,154,0.15);
    box-shadow: 0 2px 10px rgba(44,20,32,0.06);
    padding: 12px 16px; border-radius: 18px;
    border-bottom-left-radius: 4px;
    display: flex; gap: 5px; align-items: center;
  }

  .typing-dots span {
    width: 6px; height: 6px;
    background: var(--rose-light); border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); background: var(--rose-light); }
    30% { transform: translateY(-5px); background: var(--rose); }
  }

  .suggestions {
    display: flex; flex-wrap: wrap; gap: 7px;
    padding: 2px 0 6px;
    animation: msgIn 0.4s ease 0.15s forwards; opacity: 0;
  }

  .chip {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; color: var(--rose-dark);
    background: rgba(232,96,154,0.08);
    border: 1px solid rgba(232,96,154,0.22);
    padding: 6px 13px; border-radius: 20px;
    cursor: pointer; transition: all 0.2s ease;
    -webkit-appearance: none;
  }

  .chip:active { background: rgba(232,96,154,0.18); transform: scale(0.97); }

  .input-area {
    padding: 12px 16px;
    padding-bottom: max(env(safe-area-inset-bottom), 12px);
    background: rgba(250,246,240,0.97);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(232,96,154,0.12);
    flex-shrink: 0;
  }

  .input-wrap {
    display: flex; align-items: flex-end; gap: 8px;
    background: white;
    border: 1.5px solid rgba(232,96,154,0.2);
    border-radius: 24px;
    padding: 8px 8px 8px 16px;
    box-shadow: 0 2px 12px rgba(44,20,32,0.05);
    transition: border-color 0.2s ease;
  }

  .input-wrap:focus-within { border-color: var(--rose); }

  textarea {
    flex: 1; border: none; outline: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 300;
    color: var(--deep); resize: none;
    line-height: 1.5; max-height: 100px; min-height: 20px;
    -webkit-appearance: none;
  }

  textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
    border: none; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(232,96,154,0.3);
    -webkit-appearance: none;
  }

  .send-btn:active { transform: scale(0.93); }
  .send-btn svg { width: 15px; height: 15px; fill: white; margin-left: 2px; }

  .footer-note {
    text-align: center; font-size: 10px;
    color: var(--muted); margin-top: 7px; letter-spacing: 0.02em;
  }

  .loading-overlay {
    position: fixed; inset: 0;
    background: var(--cream);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 100;
    transition: opacity 0.5s ease;
  }

  .loading-overlay.hidden { opacity: 0; pointer-events: none; }

  .loading-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px; font-weight: 300;
    letter-spacing: 0.06em; color: var(--deep);
  }

  .loading-logo span { color: var(--rose); font-style: italic; }

  .loading-sub {
    font-size: 12px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  .loading-dots { display: flex; gap: 6px; }
  .loading-dots span {
    width: 6px; height: 6px;
    background: var(--rose-light); border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  #anchor { height: 1px; flex-shrink: 0; }

  .error-bubble {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px; color: #B91C1C;
    max-width: 88%;
    align-self: flex-start;
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-logo">jun<span>tos</span></div>
  <div class="loading-sub">Your space, Frida</div>
  <div class="loading-dots"><span></span><span></span><span></span></div>
</div>

<div class="header">
  <div class="logo-area">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M12 21.7C6.5 18.9 3 14.5 3 10c0-4.4 4-8 9-8s9 3.6 9 8c0 4.5-3.5 8.9-9 11.7z"/></svg>
    </div>
    <div class="logo-text">jun<span>tos</span></div>
  </div>
  <div class="header-right">Frida's space</div>
</div>

<div class="status-bar">
  <div class="status-dot"></div>
  <div class="status-text">Juntos remembers themes to help future conversations. If you share that you might hurt yourself, Juntos may send a safety alert.</div>
</div>

<div class="chat-area" id="chatArea">
  <div id="anchor"></div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea
      id="msgInput"
      placeholder="Share what's on your mind…"
      rows="1"
      oninput="resize(this)"
      onkeydown="handleKey(event)"
    ></textarea>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="footer-note">Built with love by Doug · Powered by Juntos</div>
</div>

<script>
const WORKER_URL = "https://juntos-proxy.dougwaage.workers.dev";

const SESSION_ID = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

let messages           = [];
let sessionActive      = false;
let sessionEnded       = false;
let inactivityTimer    = null;
let lastSavedIndex     = 0;
let turnsSinceLastSave = 0;

const INACTIVITY_MS       = 10 * 60 * 1000;
const PERIODIC_SAVE_TURNS = 4;

// ─── SESSION END ──────────────────────────────────────────────────────────────

async function endSession(source) {
  if (sessionEnded) return;
  if (messages.filter(m => m.role === "user").length < 2) return;
  sessionEnded = true;
  clearTimeout(inactivityTimer);
  fireEndSession(source, true);
}

function periodicSave() {
  if (messages.filter(m => m.role === "user").length < 2) return;
  fireEndSession("periodic", false);
}

function fireEndSession(source, keepalive) {
  try {
    fetch(`${WORKER_URL}/end-session`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages,
        source,
        sessionId: SESSION_ID,
        lastSavedIndex
      }),
      keepalive
    }).then(r => {
      if (r && r.ok) lastSavedIndex = messages.length;
    }).catch(() => {});
  } catch (e) { console.error("fireEndSession error", e); }
}

function resetInactivityTimer() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => endSession("inactivity"), INACTIVITY_MS);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") endSession("visibility");
});

window.addEventListener("pagehide", () => endSession("pagehide"));

// ─── CLAUDE API ───────────────────────────────────────────────────────────────

async function callClaude(userMessage) {
  messages.push({ role: "user", content: userMessage });
  resetInactivityTimer();

  turnsSinceLastSave++;
  if (turnsSinceLastSave >= PERIODIC_SAVE_TURNS) {
    turnsSinceLastSave = 0;
    periodicSave();
  }

  const response = await fetch(`${WORKER_URL}/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages })
  });

  if (!response.ok) throw new Error(`API error: ${response.status}`);

  const data = await response.json();
  const reply = data.content.find(b => b.type === "text")?.text || "I'm here. Take your time.";
  messages.push({ role: "assistant", content: reply });
  return reply;
}

// ─── UI HELPERS ───────────────────────────────────────────────────────────────

function resize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function scrollToBottom() {
  document.getElementById("anchor").scrollIntoView({ behavior: "smooth" });
}

function setBubbleText(bubble, text) {
  text.split("\n").forEach((line, i, arr) => {
    bubble.appendChild(document.createTextNode(line));
    if (i < arr.length - 1) bubble.appendChild(document.createElement("br"));
  });
}

function addMessage(role, text, delay = 0) {
  const chatArea = document.getElementById("chatArea");
  const anchor   = document.getElementById("anchor");
  const div      = document.createElement("div");
  div.className  = `message ${role}`;
  div.style.animationDelay = `${delay}s`;

  const label       = document.createElement("div");
  label.className   = "msg-label";
  label.textContent = role === "agent" ? "Juntos" : "Frida";

  const bubble     = document.createElement("div");
  bubble.className = "bubble";
  setBubbleText(bubble, text);

  div.appendChild(label);
  div.appendChild(bubble);
  chatArea.insertBefore(div, anchor);
  scrollToBottom();
}

function showTyping() {
  const chatArea = document.getElementById("chatArea");
  const anchor   = document.getElementById("anchor");
  const el       = document.createElement("div");
  el.className   = "typing-wrap";
  el.id          = "typingIndicator";
  el.style.opacity = "1";
  el.innerHTML   = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
  chatArea.insertBefore(el, anchor);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

function addError(text) {
  const chatArea = document.getElementById("chatArea");
  const anchor   = document.getElementById("anchor");
  const el       = document.createElement("div");
  el.className   = "error-bubble";
  el.textContent = text;
  chatArea.insertBefore(el, anchor);
  scrollToBottom();
}

function addChips(options) {
  const chatArea = document.getElementById("chatArea");
  const anchor   = document.getElementById("anchor");
  const el       = document.createElement("div");
  el.className   = "suggestions";
  el.id          = "chipRow";
  options.forEach(o => {
    const btn     = document.createElement("button");
    btn.className = "chip";
    btn.textContent = o;
    btn.addEventListener("click", () => selectChip(o));
    el.appendChild(btn);
  });
  chatArea.insertBefore(el, anchor);
  scrollToBottom();
}

function selectChip(text) {
  const chips = document.getElementById("chipRow");
  if (chips) chips.remove();
  const input = document.getElementById("msgInput");
  input.value = text;
  resize(input);
  input.focus();
}

// ─── CORE FLOW ────────────────────────────────────────────────────────────────

async function agentRespond(userMessage) {
  showTyping();
  try {
    const reply = await callClaude(userMessage);
    removeTyping();
    addMessage("agent", reply);

    if (messages.length >= 12 && !document.getElementById("chipRow")) {
      const lower = reply.toLowerCase();
      if (lower.includes("before you go") || lower.includes("save a note") || lower.includes("wrap up")) {
        addChips(["Yes, wrap up", "No thanks, I'm done"]);
      }
    }
  } catch (e) {
    removeTyping();
    addError("Something went wrong. Please try again in a moment.");
    console.error(e);
  }
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const text  = input.value.trim();
  if (!text || !sessionActive) return;

  const chips = document.getElementById("chipRow");
  if (chips) chips.remove();

  if (text === "Yes, wrap up") {
    input.value = "";
    input.style.height = "auto";
    addMessage("user", "Yes, wrap up");
    showTyping();
    try {
      await fetch(`${WORKER_URL}/end-session`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages,
          source: "manual",
          sessionId: SESSION_ID,
          lastSavedIndex
        })
      });
      sessionEnded = true;
      removeTyping();
      addMessage("agent", "Done. I'll remember the important themes from today. 💛");
    } catch (e) {
      removeTyping();
      addMessage("agent", "I wasn't able to save just now, but that's okay. Take care of yourself. 💛");
    }
    return;
  }

  if (text === "No thanks, I'm done") {
    input.value = "";
    input.style.height = "auto";
    addMessage("user", "No thanks, I'm done");
    addMessage("agent", "That's okay. I'll be here whenever you need. 💛");
    endSession("manual-done");
    return;
  }

  addMessage("user", text);
  input.value = "";
  input.style.height = "auto";
  await agentRespond(text);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

function init() {
  setTimeout(() => {
    document.getElementById("loadingOverlay").classList.add("hidden");
  }, 1200);

  const chatArea = document.getElementById("chatArea");
  const anchor   = document.getElementById("anchor");
  const divider  = document.createElement("div");
  divider.className = "date-divider";
  const span = document.createElement("span");
  span.textContent = "Today";
  divider.appendChild(span);
  chatArea.insertBefore(divider, anchor);

  setTimeout(() => {
    sessionActive = true;
    resetInactivityTimer();
    addMessage("agent", "Hi Frida. I'm glad you're here. What's on your mind today?");
  }, 1400);
}

init();
</script>
</body>
</html>
